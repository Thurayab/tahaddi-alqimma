<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>تحدي القمة | رياضيات أول متوسط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191033;
    --bg-grad:#2A1B5E;
    --card:#271B54;
    --card-light:#332464;
    --line:#453476;
    --gold:#FFC93C;
    --gold-dark:#C9962B;
    --teal:#2FE6C5;
    --pink:#FF6B9D;
    --purple:#9D7BFF;
    --orange:#FFA552;
    --blue:#5DC3FF;
    --text:#F4F1FF;
    --muted:#AFA3D9;
    --danger:#FF5D73;
    --success:#2FE6C5;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #3B2A80 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #24184F 0%, transparent 40%),
      linear-gradient(180deg,var(--bg) 0%, #140B29 100%);
    min-height:100vh;
    font-family:'Cairo',sans-serif;
    color:var(--text);
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Baloo Bhaijaan 2',sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:40px; position:relative;}
  button{font-family:'Cairo',sans-serif; cursor:pointer; border:none;}
  input,textarea,select{font-family:'Cairo',sans-serif;}
  ::selection{background:var(--purple); color:#fff;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; position:sticky; top:0; z-index:20;
    background:rgba(25,16,51,0.88); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .topbar .who{display:flex; flex-direction:column; line-height:1.3;}
  .topbar .who b{font-size:15px;}
  .topbar .who span{font-size:12px; color:var(--muted);}
  .score-pill{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:#2A1B00; font-weight:800; padding:8px 14px; border-radius:99px;
    font-size:14px; display:flex; align-items:center; gap:6px;
    box-shadow:0 4px 14px rgba(255,201,60,0.35);
  }
  .icon-btn{
    background:var(--card-light); width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    border:1px solid var(--line);
  }

  /* ---- login screen ---- */
  .hero{padding:38px 24px 10px; text-align:center;}
  .hero .badge{
    font-size:48px; display:inline-block; margin-bottom:6px;
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:28px; margin:6px 0 4px; font-weight:800;}
  .hero p{color:var(--muted); font-size:14.5px; margin:0; line-height:1.6;}

  .class-choice{display:flex; gap:14px; padding:24px; }
  .class-card{
    flex:1; background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
    padding:22px 10px; text-align:center; transition:transform .15s, border-color .15s;
  }
  .class-card.selected{border-color:var(--teal); background:var(--card-light); transform:translateY(-4px);}
  .class-card .letter{font-size:34px; font-weight:800; font-family:'Baloo Bhaijaan 2';}
  .class-card .lab{font-size:13px; color:var(--muted); margin-top:4px;}

  .field-wrap{padding:0 24px;}
  .field-wrap label{font-size:13px; color:var(--muted); display:block; margin-bottom:8px;}
  .field-wrap input{
    width:100%; padding:14px 16px; border-radius:14px; border:2px solid var(--line);
    background:var(--card); color:var(--text); font-size:16px;
  }
  .field-wrap input:focus{outline:none; border-color:var(--teal);}

  .primary-btn{
    display:block; width:calc(100% - 48px); margin:26px 24px 8px; padding:16px;
    background:linear-gradient(135deg,var(--pink),#C93E68); color:#fff; font-weight:800;
    font-size:16px; border-radius:16px; box-shadow:0 8px 20px rgba(255,107,157,0.3);
  }
  .primary-btn:disabled{opacity:.4;}
  .ghost-link{
    display:block; text-align:center; color:var(--muted); font-size:13px; margin-top:18px;
    text-decoration:underline; background:none;
  }

  /* ---- dashboard / path ---- */
  .section-title{padding:22px 24px 6px; display:flex; align-items:center; justify-content:space-between;}
  .section-title h2{font-size:18px; margin:0;}
  .section-title .link{font-size:13px; color:var(--teal); background:none;}
  .rank-banner{
    margin:14px 24px 0; padding:14px 16px; border-radius:16px;
    background:linear-gradient(120deg,#3A2A78,#4B3494); border:1px solid var(--purple);
    font-size:13.5px; display:flex; align-items:center; gap:10px;
  }
  .rank-banner .t{font-size:24px;}

  .chapter-header{
    position:relative; z-index:1; margin:26px 0 18px; display:flex; align-items:center; gap:10px;
    justify-content:center; text-align:center;
  }
  .chapter-header .num{
    width:34px; height:34px; min-width:34px; border-radius:50%; background:var(--card-light);
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-family:'Baloo Bhaijaan 2'; font-size:15px; color:var(--gold);
  }
  .chapter-header .txt{font-size:14px; font-weight:700; background:var(--bg); padding:0 6px;}
  .path{position:relative; padding:34px 24px 10px;}
  .path::before{
    content:""; position:absolute; top:0; bottom:40px; right:calc(50% - 1px); width:2px;
    background:repeating-linear-gradient(to bottom, var(--line) 0 8px, transparent 8px 16px);
    z-index:0;
  }
  .node-row{display:flex; justify-content:center; margin-bottom:8px; position:relative; z-index:1;}
  .node-row.off-r{justify-content:flex-end;}
  .node-row.off-l{justify-content:flex-start;}
  .node{
    width:120px; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; text-align:center;
  }
  .node .circle{
    width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:30px; border:3px solid rgba(255,255,255,0.15); position:relative;
    box-shadow:0 8px 18px rgba(0,0,0,0.35);
  }
  .node .lab{font-size:12.5px; font-weight:700; line-height:1.3; max-width:110px;}
  .node.locked .circle{background:#241A45; color:#5B5087;}
  .node.locked .lab{color:#5B5087;}
  .node.done .circle{border-color:var(--success);}
  .node .check{
    position:absolute; bottom:-4px; left:-4px; background:var(--success); color:#0A2E27;
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; border:2px solid var(--bg);
  }

  /* ---- quiz ---- */
  .quiz-wrap{padding:20px 24px;}
  .progress-track{height:8px; background:var(--card); border-radius:99px; overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--purple)); border-radius:99px; transition:width .3s;}
  .q-card{background:var(--card); border-radius:var(--radius); padding:24px 20px; border:1px solid var(--line);}
  .q-topic{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .q-text{font-size:19px; font-weight:700; line-height:1.6; margin-bottom:20px;}
  .choice{
    display:block; width:100%; text-align:right; background:var(--card-light); color:var(--text);
    padding:15px 16px; border-radius:14px; margin-bottom:12px; font-size:15.5px; border:2px solid transparent;
  }
  .choice.correct{border-color:var(--success); background:rgba(47,230,197,0.15); font-weight:700;}
  .choice.wrong{border-color:var(--danger); background:rgba(255,93,115,0.15);}
  .choice:disabled{opacity:.85;}
  .feedback{margin-top:14px; font-size:14px; font-weight:700; min-height:20px;}
  .feedback.ok{color:var(--success);}
  .feedback.bad{color:var(--danger);}
  .next-btn{
    margin-top:18px; width:100%; padding:15px; border-radius:14px; background:var(--purple);
    color:#fff; font-weight:800; font-size:15px;
  }
  .next-btn:disabled{opacity:.3;}

  /* ---- result ---- */
  .result-wrap{padding:40px 24px; text-align:center;}
  .result-wrap .big-emoji{font-size:64px; animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.4); opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1); opacity:1;}}
  .result-wrap h2{font-size:24px; margin:10px 0 4px;}
  .result-wrap p{color:var(--muted); font-size:14.5px;}
  .stat-row{display:flex; gap:12px; margin:22px 0;}
  .stat-box{flex:1; background:var(--card); border-radius:16px; padding:16px 8px; border:1px solid var(--line);}
  .stat-box .n{font-size:22px; font-weight:800; font-family:'Baloo Bhaijaan 2';}
  .stat-box .l{font-size:11.5px; color:var(--muted);}

  /* ---- leaderboard ---- */
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:10px; padding:20px 24px 4px;}
  .podium .p{flex:1; text-align:center;}
  .podium .p .av{font-size:30px;}
  .podium .p .nm{font-size:12.5px; font-weight:700; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .podium .p .sc{font-size:11px; color:var(--muted);}
  .podium .bar{border-radius:12px 12px 0 0; margin-top:8px; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-weight:800; font-family:'Baloo Bhaijaan 2';}
  .podium .p1 .bar{height:96px; background:linear-gradient(180deg,var(--gold),var(--gold-dark)); color:#3A2900;}
  .podium .p2 .bar{height:72px; background:linear-gradient(180deg,#CFCFE6,#9C9CC0); color:#20203A;}
  .podium .p3 .bar{height:56px; background:linear-gradient(180deg,#E3A26B,#B06E3B); color:#361F08;}

  .list-row{
    display:flex; align-items:center; gap:12px; padding:12px 16px; margin:8px 24px;
    background:var(--card); border-radius:14px; border:1px solid var(--line);
  }
  .list-row .rk{width:26px; text-align:center; font-weight:800; color:var(--muted); font-size:14px;}
  .list-row .nm{flex:1; font-size:14.5px; font-weight:600;}
  .list-row .sc{font-size:13.5px; color:var(--gold); font-weight:800;}
  .list-row.me{border-color:var(--teal);}

  /* ---- admin ---- */
  .admin-wrap{padding:20px 24px;}
  .tab-row{display:flex; gap:8px; margin-bottom:18px;}
  .tab-btn{flex:1; padding:11px; border-radius:12px; background:var(--card); color:var(--muted); font-weight:700; font-size:13.5px; border:1px solid var(--line);}
  .tab-btn.active{background:var(--purple); color:#fff;}
  .admin-card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .admin-card h3{margin:0 0 10px; font-size:15px;}
  .admin-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .admin-row input{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card-light); color:var(--text); font-size:13.5px;}
  .mini-btn{padding:8px 10px; border-radius:10px; background:var(--card-light); color:var(--text); font-size:13px; border:1px solid var(--line); white-space:nowrap;}
  .mini-btn.danger{color:var(--danger);}
  .mini-btn.good{color:var(--success);}
  .save-bar{position:sticky; bottom:0; padding:14px 0; background:linear-gradient(0deg,var(--bg) 60%, transparent);}
  .save-btn{width:100%; padding:15px; border-radius:14px; background:linear-gradient(135deg,var(--teal),#1FA98E); color:#06251F; font-weight:800; font-size:15px;}
  .qedit{border-top:1px dashed var(--line); padding-top:10px; margin-top:10px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--success); color:#06251F;
    padding:10px 20px; border-radius:99px; font-weight:800; font-size:13.5px; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.3);
  }
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px;}
  .loading{text-align:center; padding:60px 20px; color:var(--muted);}
</style>
</head>

/* ================== STORAGE HELPERS ================== */
async function safeGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function safeSet(key, value, shared){
  try{ await window.storage.set(key, value, shared); return true; }
  catch(e){ return false; }
}
async function safeList(prefix, shared){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}

async function loadTopics(){
  const raw = await safeGet("topics-v2", true);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  await safeSet("topics-v2", JSON.stringify(DEFAULT_TOPICS), true);
  return JSON.parse(JSON.stringify(DEFAULT_TOPICS));
}
async function saveTopics(topics){ await safeSet("topics-v2", JSON.stringify(topics), true); }

function studentKey(cls, name){ return "student:" + cls + ":" + encodeURIComponent(name); }

async function loadStudent(cls, name){
  const raw = await safeGet(studentKey(cls,name), true);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  const fresh = { name, cls, topicScores:{}, completed:[], joined:Date.now() };
  await safeSet(studentKey(cls,name), JSON.stringify(fresh), true);
  return fresh;
}
async function saveStudent(st){ await safeSet(studentKey(st.cls, st.name), JSON.stringify(st), true); }

async function loadClassStudents(cls){
  const keys = await safeList("student:" + cls + ":", true);
  const out = [];
  for(const k of keys){
    const raw = await safeGet(k, true);
    if(raw){ try{ out.push(JSON.parse(raw)); }catch(e){} }
  }
  out.sort((a,b)=> totalScore(b) - totalScore(a));
  return out;
}
function totalScore(st){
  return Object.values(st.topicScores||{}).reduce((s,v)=>s+v,0);
}
async function deleteStudent(cls, name){
  try{ await window.storage.delete(studentKey(cls,name), true); }catch(e){}
}

/* ================== APP STATE ================== */
let STATE = {
  screen:"loading",
  cls:null, name:null,
  topics:[], student:null,
  quizTopic:null, quizIdx:0, quizCorrect:0, quizAnswered:false,
  adminAuthed:false, adminTab:"students", adminTopics:null, adminStudents:{"أ":[],"ب":[]},
  toast:null
};

async function boot(){
  STATE.topics = await loadTopics();
  const sessRaw = await safeGet("session", false);
  if(sessRaw){
    try{
      const sess = JSON.parse(sessRaw);
      if(sess && sess.cls && sess.name){
        STATE.cls = sess.cls; STATE.name = sess.name;
        STATE.student = await loadStudent(sess.cls, sess.name);
        STATE.screen = "dashboard";
        render(); return;
      }
    }catch(e){}
  }
  STATE.screen = "login";
  render();
}

function showToast(msg){
  STATE.toast = msg;
  render();
  setTimeout(()=>{ STATE.toast = null; render(); }, 1800);
}

/* ================== RENDER ================== */
async function render(){
  const app = document.getElementById("app");
  let html = "";
  if(STATE.screen === "loading") html = `<div class="loading">جارِ التحميل...</div>`;
  else if(STATE.screen === "login") html = renderLogin();
  else if(STATE.screen === "dashboard") html = await renderDashboard();
  else if(STATE.screen === "quiz") html = renderQuiz();
  else if(STATE.screen === "result") html = renderResult();
  else if(STATE.screen === "leaderboard") html = await renderLeaderboard();
  else if(STATE.screen === "adminlogin") html = renderAdminLogin();
  else if(STATE.screen === "admin") html = renderAdmin();

  if(STATE.toast) html += `<div class="toast">${STATE.toast}</div>`;
  app.innerHTML = html;
}

let pendingNameVal = "";
async function startSession(){
  const nameEl = document.getElementById("nameInput");
  const name = (nameEl.value || "").trim();
  if(!pendingClass){ showToast("اختاري الفصل أولاً"); return; }
  if(!name){ showToast("اكتبي اسمكِ أولاً"); return; }
  STATE.cls = pendingClass; STATE.name = name;
  await safeSet("session", JSON.stringify({cls:pendingClass, name}), false);
  STATE.student = await loadStudent(pendingClass, name);
  STATE.screen = "dashboard";
  render();
}
function logout(){
  safeSet("session", "", false);
  pendingClass = null; pendingNameVal = "";
  STATE.cls = null; STATE.name = null; STATE.student = null;
  STATE.screen = "login"; render();
}

/* ---- DASHBOARD ---- */
async function renderDashboard(){
  const topics = STATE.topics;
  const st = STATE.student;
  const score = totalScore(st);
  const classList = await loadClassStudents(STATE.cls);
  const rank = classList.findIndex(s => s.name === STATE.name) + 1;

  let rankBanner = "";
  if(rank >= 1 && rank <= 3){
    const trophy = rank===1?"🏆":rank===2?"🥈":"🥉";
    rankBanner = `<div class="rank-banner"><span class="t">${trophy}</span><span>رائعة! أنتِ في المركز ${rank===1?'الأول':rank===2?'الثاني':'الثالث'} في الفصل ${STATE.cls}</span></div>`;
  }

  let nodes = "";
  let lastChapter = null;
  topics.forEach((t, i) => {
    if(t.chapter && t.chapter !== lastChapter){
      const chInfo = CHAPTERS.find(c => c.num === t.chapter);
      nodes += `<div class="chapter-header"><div class="num">${t.chapter}</div><div class="txt">${escapeHtml(chInfo ? chInfo.title : ('الفصل ' + t.chapter))}</div></div>`;
      lastChapter = t.chapter;
    }
    const done = st.completed.includes(t.id);
    const locked = i>0 && !st.completed.includes(topics[i-1].id);
    const side = i % 2 === 0 ? "off-r" : "off-l";
    const clr = TOPIC_COLORS[t.color] || "var(--teal)";
    nodes += `
    <div class="node-row ${side}">
      <button class="node ${locked?'locked':''} ${done?'done':''}" ${locked?'disabled':`onclick="openTopic('${t.id}')"`}>
        <div class="circle" style="${!locked?`background:${clr}22; border-color:${clr};`:''}">
          ${locked ? "🔒" : t.icon}
          ${done ? '<div class="check">✓</div>' : ''}
        </div>
        <div class="lab">${t.num ? t.num + ' · ' : ''}${t.title}</div>
      </button>
    </div>`;
  });

  return `
  <div class="topbar">
    <button class="icon-btn" onclick="logout()">⇤</button>
    <div class="who"><b>${escapeHtml(STATE.name)}</b><span>الفصل ${STATE.cls}</span></div>
    <div class="score-pill">⭐ ${score}</div>
  </div>
  ${rankBanner}
  <div class="section-title">
    <h2>مسار التحدي</h2>
    <button class="link" onclick="STATE.screen='leaderboard'; render();">لوحة الصدارة 🏆</button>
  </div>
  <div class="path">${nodes}</div>
  `;
}

function openTopic(topicId){
  const topic = STATE.topics.find(t => t.id === topicId);
  if(!topic) return;
  STATE.quizTopic = topic;
  STATE.quizIdx = 0;
  STATE.quizCorrect = 0;
  STATE.quizAnswered = false;
  STATE.screen = "quiz";
  render();
}

/* ---- QUIZ ---- */
function renderQuiz(){
  const t = STATE.quizTopic;
  const q = t.questions[STATE.quizIdx];
  const pct = Math.round((STATE.quizIdx / t.questions.length) * 100);
  const clr = TOPIC_COLORS[t.color] || "var(--teal)";

  let choices = "";
  q.c.forEach((choice, idx) => {
    let cls = "choice";
    if(STATE.quizAnswered){
      if(idx === q.a) cls += " correct";
      else if(idx === STATE.selectedIdx) cls += " wrong";
    }
    choices += `<button class="${cls}" ${STATE.quizAnswered?'disabled':''} onclick="answerQuiz(${idx})">${escapeHtml(choice)}</button>`;
  });

  let feedback = "";
  if(STATE.quizAnswered){
    feedback = STATE.selectedIdx === q.a
      ? `<div class="feedback ok">أحسنتِ! إجابة صحيحة 🎉</div>`
      : `<div class="feedback bad">إجابة غير صحيحة، الصحيحة: ${escapeHtml(q.c[q.a])}</div>`;
  }

  const isLast = STATE.quizIdx === t.questions.length - 1;

  return `
  <div class="topbar">
    <button class="icon-btn" onclick="STATE.screen='dashboard'; render();">✕</button>
    <div class="who"><b>${escapeHtml(t.title)}</b><span>سؤال ${STATE.quizIdx+1} من ${t.questions.length}</span></div>
    <div class="score-pill">⭐ ${totalScore(STATE.student)}</div>
  </div>
  <div class="quiz-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${clr};"></div></div>
    <div class="q-card">
      <div class="q-topic">${t.icon} ${t.num ? t.num + ' · ' : ''}${escapeHtml(t.title)}</div>
      <div class="q-text">${escapeHtml(q.q)}</div>
      ${choices}
      ${feedback}
    </div>
    <button class="next-btn" ${STATE.quizAnswered?'':'disabled'} onclick="${isLast? 'finishQuiz()' : 'nextQuestion()'}">
      ${isLast ? 'عرض النتيجة' : 'السؤال التالي'}
    </button>
  </div>
  `;
}
function answerQuiz(idx){
  if(STATE.quizAnswered) return;
  STATE.selectedIdx = idx;
  STATE.quizAnswered = true;
  const q = STATE.quizTopic.questions[STATE.quizIdx];
  if(idx === q.a) STATE.quizCorrect++;
  render();
}
function nextQuestion(){
  STATE.quizIdx++;
  STATE.quizAnswered = false;
  STATE.selectedIdx = null;
  render();
}
async function finishQuiz(){
  const t = STATE.quizTopic;
  const points = STATE.quizCorrect * 10;
  const st = STATE.student;
  const prevBest = (st.topicScores && st.topicScores[t.id]) || 0;
  st.topicScores = st.topicScores || {};
  st.topicScores[t.id] = Math.max(prevBest, points);
  if(!st.completed.includes(t.id)) st.completed.push(t.id);
  await saveStudent(st);
  STATE.screen = "result";
  render();
}

/* ---- RESULT ---- */
function renderResult(){
  const t = STATE.quizTopic;
  const total = t.questions.length;
  const correct = STATE.quizCorrect;
  const pct = Math.round((correct/total)*100);
  const emoji = pct===100 ? "🌟" : pct>=70 ? "🎉" : pct>=40 ? "💪" : "🌱";
  const msg = pct===100 ? "إجابات مثالية بالكامل!" : pct>=70 ? "أداء رائع جدًا!" : pct>=40 ? "بداية جيدة، واصلي التدريب!" : "لا بأس، حاولي مرة أخرى لتتقني الموضوع!";
  return `
  <div class="result-wrap">
    <div class="big-emoji">${emoji}</div>
    <h2>${msg}</h2>
    <p>موضوع: ${escapeHtml(t.title)}</p>
    <div class="stat-row">
      <div class="stat-box"><div class="n">${correct}/${total}</div><div class="l">إجابات صحيحة</div></div>
      <div class="stat-box"><div class="n">${correct*10}</div><div class="l">نقطة مكتسبة</div></div>
      <div class="stat-box"><div class="n">${pct}%</div><div class="l">النسبة</div></div>
    </div>
    <button class="primary-btn" style="margin:0;width:100%;" onclick="STATE.screen='dashboard'; render();">متابعة التحدي</button>
    <button class="ghost-link" onclick="STATE.screen='leaderboard'; render();">عرض لوحة الصدارة</button>
  </div>
  `;
}

/* ---- LEADERBOARD ---- */
async function renderLeaderboard(){
  const students = await loadClassStudents(STATE.cls);
  const top3 = students.slice(0,3);
  const rest = students.slice(3);

  let podium = "";
  const order = [1,0,2]; // display 2nd, 1st, 3rd
  const podiumHtml = order.map(i => {
    const s = top3[i];
    if(!s) return `<div class="p p${i+1}"></div>`;
    const av = i===0?"🏆":i===1?"🥈":"🥉";
    return `<div class="p p${i+1}">
      <div class="av">${av}</div>
      <div class="nm">${escapeHtml(s.name)}</div>
      <div class="sc">${totalScore(s)} نقطة</div>
      <div class="bar">${i+1}</div>
    </div>`;
  }).join("");

  let rows = "";
  rest.forEach((s, idx) => {
    const rk = idx + 4;
    rows += `<div class="list-row ${s.name===STATE.name?'me':''}">
      <div class="rk">${rk}</div>
      <div class="nm">${escapeHtml(s.name)}</div>
      <div class="sc">${totalScore(s)} ⭐</div>
    </div>`;
  });

  return `
  <div class="topbar">
    <button class="icon-btn" onclick="STATE.screen='dashboard'; render();">→</button>
    <div class="who"><b>لوحة الصدارة</b><span>الفصل ${STATE.cls}</span></div>
    <div class="icon-btn">🏆</div>
  </div>
  <div class="podium">${podiumHtml}</div>
  ${students.length===0 ? '<div class="empty">لا توجد نتائج بعد، كوني أول من يبدأ! 🚀</div>' : rows}
  `;
}

/* ---- ADMIN LOGIN ---- */
let adminPassInput = "";
function renderAdminLogin(){
  return `
  <div class="hero">
    <div class="badge">🔐</div>
    <h1>لوحة المعلمة</h1>
    <p>أدخلي كلمة المرور للوصول إلى لوحة التحكم</p>
  </div>
  <div class="field-wrap">
    <label>كلمة المرور</label>
    <input type="password" placeholder="••••" value="${adminPassInput}" oninput="adminPassInput=this.value" onkeydown="if(event.key==='Enter') tryAdminLogin();">
  </div>
  <button class="primary-btn" onclick="tryAdminLogin()">دخول</button>
  <button class="ghost-link" onclick="STATE.screen='login'; render();">رجوع</button>
  `;
}
async function tryAdminLogin(){
  if(adminPassInput === ADMIN_PASSWORD){
    STATE.adminAuthed = true;
    STATE.adminTopics = JSON.parse(JSON.stringify(STATE.topics));
    STATE.adminStudents["أ"] = await loadClassStudents("أ");
    STATE.adminStudents["ب"] = await loadClassStudents("ب");
    STATE.screen = "admin";
    adminPassInput = "";
    render();
  } else {
    showToast("كلمة المرور غير صحيحة");
  }
}

/* ---- ADMIN PANEL ---- */
function renderAdmin(){
  return `
  <div class="topbar">
    <button class="icon-btn" onclick="STATE.screen='login'; STATE.adminAuthed=false; render();">✕</button>
    <div class="who"><b>لوحة التحكم</b><span>إدارة المحتوى والطالبات</span></div>
    <div class="icon-btn">🔐</div>
  </div>
  <div class="admin-wrap">
    <div class="tab-row">
      <button class="tab-btn ${STATE.adminTab==='students'?'active':''}" onclick="STATE.adminTab='students'; render();">الطالبات</button>
      <button class="tab-btn ${STATE.adminTab==='topics'?'active':''}" onclick="STATE.adminTab='topics'; render();">المواضيع والأسئلة</button>
    </div>
    ${STATE.adminTab==='students' ? renderAdminStudents() : renderAdminTopics()}
  </div>
  `;
}

function renderAdminStudents(){
  let html = "";
  ["أ","ب"].forEach(cls => {
    const list = STATE.adminStudents[cls] || [];
    html += `<div class="admin-card"><h3>الفصل ${cls} (${list.length} طالبة)</h3>`;
    if(list.length === 0){
      html += `<div class="empty">لا يوجد طالبات مسجلات بعد</div>`;
    } else {
      list.forEach(s => {
        html += `<div class="admin-row">
          <span style="flex:1;">${escapeHtml(s.name)}</span>
          <span style="color:var(--gold); font-weight:800;">${totalScore(s)} ⭐</span>
          <button class="mini-btn danger" onclick="adminDeleteStudent('${cls}','${encodeURIComponent(s.name)}')">حذف</button>
        </div>`;
      });
    }
    html += `</div>`;
  });
  return html;
}
async function adminDeleteStudent(cls, encName){
  const name = decodeURIComponent(encName);
  if(!confirm("هل تريدين حذف بيانات هذه الطالبة نهائيًا؟")) return;
  await deleteStudent(cls, name);
  STATE.adminStudents[cls] = await loadClassStudents(cls);
  showToast("تم الحذف");
}

function renderAdminTopics(){
  let html = "";
  STATE.adminTopics.forEach((t, ti) => {
    html += `<div class="admin-card">
      ${t.num ? `<div style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">الفصل ${t.chapter||''} · الدرس ${t.num}</div>` : ''}
      <div class="admin-row">
        <input value="${escapeAttr(t.icon)}" style="max-width:50px; text-align:center;" oninput="STATE.adminTopics[${ti}].icon=this.value">
        <input value="${escapeAttr(t.title)}" oninput="STATE.adminTopics[${ti}].title=this.value">
        <button class="mini-btn" onclick="moveTopicUp(${ti})">↑</button>
        <button class="mini-btn" onclick="moveTopicDown(${ti})">↓</button>
        <button class="mini-btn danger" onclick="deleteTopic(${ti})">حذف</button>
      </div>`;
    t.questions.forEach((q, qi) => {
      html += `<div class="qedit">
        <div class="admin-row"><input value="${escapeAttr(q.q)}" oninput="STATE.adminTopics[${ti}].questions[${qi}].q=this.value" placeholder="نص السؤال"></div>
        ${q.c.map((choice,ci)=>`
        <div class="admin-row">
          <button class="mini-btn ${q.a===ci?'good':''}" onclick="setCorrect(${ti},${qi},${ci})">${q.a===ci?'✓ صحيحة':'اختيار'}</button>
          <input value="${escapeAttr(choice)}" oninput="STATE.adminTopics[${ti}].questions[${qi}].c[${ci}]=this.value">
        </div>`).join("")}
        <button class="mini-btn danger" onclick="deleteQuestion(${ti},${qi})">حذف السؤال</button>
      </div>`;
    });
    html += `<button class="mini-btn" style="margin-top:8px;" onclick="addQuestion(${ti})">+ إضافة سؤال</button>
    </div>`;
  });
  html += `<button class="mini-btn" style="width:100%; padding:14px;" onclick="addTopic()">+ إضافة موضوع جديد</button>
  <div class="save-bar"><button class="save-btn" onclick="saveAdminTopics()">💾 حفظ كل التعديلات</button></div>`;
  return html;
}
function moveTopicUp(i){ if(i===0) return; const a=STATE.adminTopics; [a[i-1],a[i]]=[a[i],a[i-1]]; render(); }
function moveTopicDown(i){ const a=STATE.adminTopics; if(i===a.length-1) return; [a[i+1],a[i]]=[a[i],a[i+1]]; render(); }
function deleteTopic(i){ if(!confirm("حذف هذا الموضوع بالكامل؟")) return; STATE.adminTopics.splice(i,1); render(); }
function addTopic(){
  STATE.adminTopics.push({ id:"t"+Date.now(), title:"موضوع جديد", icon:"✨", color:"teal", questions:[
    {q:"سؤال جديد", c:["إجابة 1","إجابة 2","إجابة 3","إجابة 4"], a:0}
  ]});
  render();
}
function addQuestion(ti){
  STATE.adminTopics[ti].questions.push({q:"سؤال جديد", c:["إجابة 1","إجابة 2","إجابة 3","إجابة 4"], a:0});
  render();
}
function deleteQuestion(ti,qi){
  if(STATE.adminTopics[ti].questions.length <= 1){ showToast("يجب أن يبقى سؤال واحد على الأقل"); return; }
  STATE.adminTopics[ti].questions.splice(qi,1); render();
}
function setCorrect(ti,qi,ci){ STATE.adminTopics[ti].questions[qi].a = ci; render(); }
async function saveAdminTopics(){
  await saveTopics(STATE.adminTopics);
  STATE.topics = JSON.parse(JSON.stringify(STATE.adminTopics));
  showToast("تم حفظ التعديلات بنجاح ✅");
}

/* ---- helpers ---- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

boot();
</script>
</body>
</html>
